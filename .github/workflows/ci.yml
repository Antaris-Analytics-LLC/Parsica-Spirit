name: ci

# Runs the release check (scripts/verify_release.py) on every push and PR, on Linux and Windows.
# It does not publish anything.
#
# Every gate runs. Until October 2026 this step passed --skip-closure-armed, so the closure gate
# (whose exclusion list is not in the repository) never ran here and the verifier's PARTIAL result
# read as success (REVIEW-2026-10.md, pile one, class (e)). A gate whose input is missing fails;
# this job is red until the exclusion list is committed or the gate is retired, and that red is
# the honest state.

on:
  push:
  pull_request:

# The release check only reads the checkout, so the job token needs nothing but read access to
# the repository. Without this block the token inherits the repository default, which can be
# read-write.
permissions:
  contents: read

jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package (editable) and gate tooling
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install pytest import-linter build

      - name: Release verification (every gate; no skips)
        run: python scripts/verify_release.py
