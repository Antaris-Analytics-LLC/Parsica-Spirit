name: ci

# Runs the release check (scripts/verify_release.py) on every push and PR, on Linux and Windows.
# It does not publish anything.
#
# --skip-closure-armed: the closure-test exclusion sidecar is site-local by design (the excluded
# module names are a tell and never ship), so it can never exist on a public runner - without the
# skip, that one gate would be permanently red here for the wrong reason. CI gates on the other
# five; the ARMED closure run is the release-side ritual, where the sidecar legitimately exists.

on:
  push:
  pull_request:

# The release check only reads the checkout, so the job token needs nothing but read access to
# the repository. Without this block the token inherits the repository default, which can be
# read-write.
permissions:
  contents: read

jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package (editable) and gate tooling
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install pytest import-linter build

      - name: Release verification (all buildable gates; closure-armed is release-side only)
        run: python scripts/verify_release.py --skip-closure-armed
